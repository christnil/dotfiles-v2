# hypridle — idle handling. Lock only after a long idle; never suspend,
# so builds, agents and downloads keep running while the screen is locked/off.
# Apps that play video/audio (browsers, mpv) inhibit idle automatically.

general {
    lock_cmd = pidof hyprlock || hyprlock          # one hyprlock instance only
    before_sleep_cmd = loginctl lock-session       # lock before lid-close/suspend
    after_sleep_cmd = hyprctl dispatch dpms on     # screen back on after resume
}

# 25 min: dim the screen as a warning
listener {
    timeout = 1500
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 30 min: lock
listener {
    timeout = 1800
    on-timeout = loginctl lock-session
}

# 35 min: screen off (processes keep running)
listener {
    timeout = 2100
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}

# No suspend listener on purpose.
